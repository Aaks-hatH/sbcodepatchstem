
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="26" fill="#080808"/>

  <!-- Orbital ring -->
  <circle cx="64" cy="64" r="49"
          fill="none" stroke="#FFD21A" stroke-width="2.5"
          stroke-dasharray="210 35"/>

  <!-- Telescope -->
  <g fill="#FFD21A" stroke="#FFD21A" stroke-width="3"
     stroke-linejoin="round">
    <path d="M29 43 L82 25 L91 39 L37 57 Z"/>
    <path d="M82 25 L95 21 L103 37 L91 39 Z"/>
    <path d="M56 49 L62 77 M62 77 L43 99 M62 77 L81 99"/>
